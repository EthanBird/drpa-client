[package]
name = "drpa-desktop"
default-run = "drpa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "drpa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
drpa-host = { path = "../../../crates/drpa-host" }
drpa-package = { path = "../../../crates/drpa-package" }
drpa-protocol = { path = "../../../crates/drpa-protocol" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "any", "postgres", "mysql"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = { version = "3", features = ["json"] }
uuid.workspace = true
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
