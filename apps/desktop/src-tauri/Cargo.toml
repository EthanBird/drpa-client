[package]
name = "drpa-desktop"
default-run = "drpa-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "drpa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
calamine = "0.36.0"
chrono.workspace = true
data-encoding = "2.9"
drpa-host = { path = "../../../crates/drpa-host" }
drpa-install = { path = "../../../crates/drpa-install" }
drpa-package = { path = "../../../crates/drpa-package" }
drpa-protocol = { path = "../../../crates/drpa-protocol" }
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
ignore = "0.4"
pdf-extract = "0.12.0"
regex = "1"
rand = "0.8"
rquickjs = "0.12.1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
sha1 = "0.10"
rusqlite.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "any", "postgres", "mysql"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tar = "0.4"
ureq = { version = "3", features = ["json"] }
uuid.workspace = true
url = "2"
zeroize = "1.8"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
