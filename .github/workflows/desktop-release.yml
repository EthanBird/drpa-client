name: Publish offline desktop preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/drpa-next-platform
    paths:
      - ".github/workflows/desktop-release.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "docs/PORTABLE_RELEASE.md"
      - "examples/bing_daily_image.rpaz"
      - "installer/**"
      - "offline/**"
      - "runtime/python/**"
      - "tools/offline/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: desktop-offline-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: host
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: app
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      DRPA_VERSION: 0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install pinned offline bundle tooling
        run: python -m pip install "uv==0.11.28"
      - name: Build and air-gap test sealed runtime
        run: python tools/offline/build_runtime_bundle.py --platform "${{ matrix.platform }}" --work-dir "${{ runner.temp }}/drpa-offline"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo timeout 300 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Generate native icon formats
        run: npm exec --workspace @drpa/desktop -- tauri icon src-tauri/icons/icon.png
      - name: Build Windows GUI host
        if: runner.os == 'Windows'
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --no-bundle
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --bundles appimage
      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --bundles app

      - name: Assemble registry-free Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WEBVIEW2_VERSION: 150.0.4078.65
          WEBVIEW2_URL: https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/c00b9782-0422-4114-be27-8eec079b394d/Microsoft.WebView2.FixedVersionRuntime.150.0.4078.65.x64.cab
          WEBVIEW2_SHA256: ca01385bc232dea83242c35ed78e98403866a36b1a0952e97fa7fd870fc39ab4
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "desktop-assets"
          $portable = Join-Path $env:RUNNER_TEMP "DRPA-Next-$env:DRPA_VERSION-windows-x86_64"
          $runtimeStage = Get-ChildItem "$env:RUNNER_TEMP/drpa-offline" -Directory -Filter "drpa-runtime-*-windows-x86_64" | Select-Object -First 1
          if (-not $runtimeStage) { throw "Sealed Windows runtime stage is missing" }
          New-Item -ItemType Directory -Force -Path $assets, "$portable/runtime", "$portable/webview2", "$portable/examples" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/drpa-desktop.exe" "$portable/DRPA Next.exe"
          Get-ChildItem $runtimeStage.FullName -Force | Copy-Item -Destination "$portable/runtime" -Recurse -Force
          Copy-Item "examples/bing_daily_image.rpaz" "$portable/examples/"
          Copy-Item "docs/PORTABLE_RELEASE.md" "$portable/README.md"

          $cab = Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.$env:WEBVIEW2_VERSION.x64.cab"
          $expanded = Join-Path $env:RUNNER_TEMP "webview2-expanded"
          curl.exe -fL --retry 3 --output $cab $env:WEBVIEW2_URL
          $actualHash = (Get-FileHash -Algorithm SHA256 $cab).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WEBVIEW2_SHA256) { throw "Fixed WebView2 checksum mismatch: $actualHash" }
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          & expand.exe -F:* $cab $expanded | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand Fixed WebView2" }
          $browser = Get-ChildItem $expanded -Recurse -File -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $browser) { throw "Fixed WebView2 executable is missing" }
          Get-ChildItem $browser.Directory.FullName -Force | Copy-Item -Destination "$portable/webview2" -Recurse -Force

          choco install nsis --version=3.12.0 --no-progress --yes
          $makensis = "C:/Program Files (x86)/NSIS/makensis.exe"
          if (-not (Test-Path $makensis)) { throw "Pinned NSIS compiler is missing" }
          $installer = Join-Path $assets "drpa-next-$env:DRPA_VERSION-windows-x86_64-setup.exe"
          & $makensis "/DPAYLOAD_DIR=$portable" "/DOUTPUT_FILE=$installer" "/DICON_FILE=$env:GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.ico" "installer/windows/drpa-next.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile registry-free Windows installer" }
          $registryCalls = Select-String -Path "installer/windows/drpa-next.nsi" -Pattern "WriteReg|DeleteReg|ReadReg|InstallDirRegKey" -CaseSensitive:$false
          if ($registryCalls) { throw "Installer contains a forbidden registry instruction" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content -Encoding ascii "$installer.sha256"

      - name: Assemble Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/desktop-assets"
          stage="${RUNNER_TEMP}/DRPA-Next-${DRPA_VERSION}-linux-x86_64"
          runtime_stage="$(find "${RUNNER_TEMP}/drpa-offline" -maxdepth 1 -type d -name 'drpa-runtime-*-linux-x86_64' -print -quit)"
          appimage="$(find "target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$runtime_stage"
          test -n "$appimage"
          mkdir -p "$assets" "$stage/runtime" "$stage/examples"
          cp -a "$runtime_stage"/. "$stage/runtime/"
          cp "$appimage" "$stage/DRPA Next.AppImage"
          chmod +x "$stage/DRPA Next.AppImage"
          cp examples/bing_daily_image.rpaz "$stage/examples/"
          cp docs/PORTABLE_RELEASE.md "$stage/README.md"
          archive="$assets/drpa-next-${DRPA_VERSION}-linux-x86_64-portable.tar.gz"
          tar -C "${RUNNER_TEMP}" -czf "$archive" "$(basename "$stage")"
          sha256sum "$archive" | sed "s#${assets}/##" > "$archive.sha256"

      - name: Assemble macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          assets="${RUNNER_TEMP}/desktop-assets"
          stage="${RUNNER_TEMP}/dmg-root"
          runtime_stage="$(find "${RUNNER_TEMP}/drpa-offline" -maxdepth 1 -type d -name 'drpa-runtime-*-${{ matrix.platform }}' -print -quit)"
          source_app="$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$runtime_stage"
          test -n "$source_app"
          mkdir -p "$assets" "$stage/examples"
          cp -R "$source_app" "$stage/DRPA Next.app"
          mkdir -p "$stage/DRPA Next.app/Contents/Resources/runtime"
          cp -a "$runtime_stage"/. "$stage/DRPA Next.app/Contents/Resources/runtime/"
          cp examples/bing_daily_image.rpaz "$stage/examples/"
          cp docs/PORTABLE_RELEASE.md "$stage/README.md"
          codesign --force --deep --sign - "$stage/DRPA Next.app"
          dmg="$assets/drpa-next-${DRPA_VERSION}-${{ matrix.platform }}.dmg"
          hdiutil create -volname "DRPA Next" -srcfolder "$stage" -ov -format UDZO "$dmg"
          hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$(basename "$dmg")" > "$dmg.sha256"

      - name: Upload offline desktop package
        uses: actions/upload-artifact@v4
        with:
          name: drpa-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Add example package and verify release set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/example
          cp examples/bing_daily_image.rpaz artifacts/example/drpa-example-bing-daily-image-0.1.0.rpaz
          cd artifacts/example
          sha256sum drpa-example-bing-daily-image-0.1.0.rpaz > drpa-example-bing-daily-image-0.1.0.rpaz.sha256
          cd ../..
          mapfile -t assets < <(find artifacts -type f | sort)
          test "${#assets[@]}" -eq 10
      - name: Publish immutable desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-v0.2.0-preview-${GITHUB_RUN_NUMBER}"
          mapfile -t assets < <(find artifacts -type f | sort)
          notes=$'Chinese-first DRPA Next offline preview.\n\nIncludes a registry-free Windows x64 guided installer, Linux x64 AppImage archive, macOS Apple Silicon DMG, macOS Intel DMG, sealed Python 3.11 runtimes and the Bing daily image RPAZ example. Windows uses a pinned Fixed Version WebView2; the custom installer contains no registry operations and stores workspace data beside the application.\n\nThis preview is unsigned/not notarized. Verify the matching SHA-256 file before moving a package to an offline machine.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "DRPA Next 0.2.0 离线预览 · ${GITHUB_RUN_NUMBER}" --notes "$notes" --prerelease
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "DRPA Next 0.2.0 离线预览 · ${GITHUB_RUN_NUMBER}" --notes "$notes"
          fi
