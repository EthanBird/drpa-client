name: Publish Windows offline desktop releases

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Release payload
        type: choice
        required: true
        default: update
        options:
          - update
          - full
  push:
    branches:
      - codex/drpa-next-platform
    paths:
      - ".github/workflows/desktop-release.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "docs/PORTABLE_RELEASE.md"
      - "examples/bing_daily_image.rpaz"
      - "installer/**"
      - "offline/**"
      - "runtime/python/**"
      - "tools/offline/**"
      - "tools/windows/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package-lock.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: desktop-offline-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: host
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      DRPA_VERSION: 1.0.0
      RELEASE_KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_kind) || 'update' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Verify synchronized product version
        run: python tools/release/check_version_consistency.py --expected "${{ env.DRPA_VERSION }}"
      - name: Install pinned offline bundle tooling
        run: python -m pip install "uv==0.11.28"
      - name: Build and air-gap test sealed runtime
        if: env.RELEASE_KIND == 'full'
        run: python tools/offline/build_runtime_bundle.py --platform "${{ matrix.platform }}" --work-dir "${{ runner.temp }}/drpa-offline"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}
      - run: npm ci
      - name: Generate native icon formats
        run: npm exec --workspace @drpa/desktop -- tauri icon src-tauri/icons/icon.png
      - name: Build Windows GUI host
        if: runner.os == 'Windows'
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --no-bundle
      - name: Build headless Windows file updater
        if: runner.os == 'Windows'
        run: cargo build -p drpa-desktop --bin drpa-updater --release --target "${{ matrix.target }}"

      - name: Assemble lightweight Windows update
        if: runner.os == 'Windows' && env.RELEASE_KIND == 'update'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "desktop-assets"
          $overlay = Join-Path $env:RUNNER_TEMP "DRPA-Next-update-overlay"
          $previous = Join-Path $env:RUNNER_TEMP "previous-release"
          New-Item -ItemType Directory -Force -Path $assets, $overlay, $previous | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/drpa-desktop.exe" "$overlay/DRPA Next.exe"
          Copy-Item "target/${{ matrix.target }}/release/drpa-updater.exe" "$overlay/drpa-updater.exe"
          python tools/offline/sync_runtime_adapter.py --runtime-root "$overlay/runtime"
          if ($LASTEXITCODE -ne 0) { throw "Failed to assemble the lightweight runtime adapter" }

          $latestTag = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName'
          if ($LASTEXITCODE -ne 0 -or -not $latestTag) { throw "A full desktop release catalog is required before publishing an update" }
          $catalogAsset = gh release view $latestTag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name | select(endswith("install-manifest.json"))' | Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or -not $catalogAsset) { throw "Latest desktop release does not contain an install catalog: $latestTag" }
          gh release download $latestTag --repo $env:GITHUB_REPOSITORY --pattern $catalogAsset --dir $previous
          if ($LASTEXITCODE -ne 0) { throw "Failed to download the base install catalog" }
          $baseManifest = Get-ChildItem $previous -File -Filter "*-install-manifest.json" | Select-Object -First 1
          if (-not $baseManifest) { throw "Downloaded base install catalog is missing" }
          $baseCatalog = Get-Content $baseManifest.FullName -Raw | ConvertFrom-Json
          if ($baseCatalog.schema -ne 2 -or $baseCatalog.updateProtocol -ne 2) {
            throw "Latest release is not a 0.3 update-protocol baseline; publish a full release first"
          }

          $update = Join-Path $assets "drpa-next-$env:DRPA_VERSION-windows-x86_64.drpa-update"
          python tools/windows/build_update_package.py --stage $overlay --output $update --version "$env:DRPA_VERSION-preview-$env:GITHUB_RUN_NUMBER" --base-manifest $baseManifest.FullName --worker "$overlay/drpa-updater.exe" --partial
          if ($LASTEXITCODE -ne 0) { throw "Failed to build lightweight Windows update" }
          $catalog = Join-Path $assets "drpa-next-$env:DRPA_VERSION-windows-x86_64-install-manifest.json"
          Copy-Item "$overlay/install-manifest.json" $catalog

      - name: Assemble registry-free Windows installer
        if: runner.os == 'Windows' && env.RELEASE_KIND == 'full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WEBVIEW2_VERSION: 150.0.4078.65
          WEBVIEW2_URL: https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/c00b9782-0422-4114-be27-8eec079b394d/Microsoft.WebView2.FixedVersionRuntime.150.0.4078.65.x64.cab
          WEBVIEW2_SHA256: ca01385bc232dea83242c35ed78e98403866a36b1a0952e97fa7fd870fc39ab4
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "desktop-assets"
          $portable = Join-Path $env:RUNNER_TEMP "DRPA-Next-$env:DRPA_VERSION-windows-x86_64"
          $runtimeStage = Get-ChildItem "$env:RUNNER_TEMP/drpa-offline" -Directory -Filter "drpa-runtime-*-windows-x86_64" | Select-Object -First 1
          if (-not $runtimeStage) { throw "Sealed Windows runtime stage is missing" }
          New-Item -ItemType Directory -Force -Path $assets, "$portable/runtime", "$portable/webview2", "$portable/examples" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/drpa-desktop.exe" "$portable/DRPA Next.exe"
          Copy-Item "target/${{ matrix.target }}/release/drpa-updater.exe" "$portable/drpa-updater.exe"
          Get-ChildItem $runtimeStage.FullName -Force | Copy-Item -Destination "$portable/runtime" -Recurse -Force
          Copy-Item "examples/bing_daily_image.rpaz" "$portable/examples/"
          Copy-Item "docs/PORTABLE_RELEASE.md" "$portable/README.md"

          $cab = Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.$env:WEBVIEW2_VERSION.x64.cab"
          $expanded = Join-Path $env:RUNNER_TEMP "webview2-expanded"
          curl.exe -fL --retry 3 --output $cab $env:WEBVIEW2_URL
          $actualHash = (Get-FileHash -Algorithm SHA256 $cab).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WEBVIEW2_SHA256) { throw "Fixed WebView2 checksum mismatch: $actualHash" }
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          & expand.exe -F:* $cab $expanded | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Failed to expand Fixed WebView2" }
          $browser = Get-ChildItem $expanded -Recurse -File -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $browser) { throw "Fixed WebView2 executable is missing" }
          Get-ChildItem $browser.Directory.FullName -Force | Copy-Item -Destination "$portable/webview2" -Recurse -Force

          $runtimeManifest = Get-Content "$portable/runtime/manifest.json" -Raw | ConvertFrom-Json
          $runtimePython = Join-Path "$portable/runtime" ($runtimeManifest.pythonExecutable -replace '/', '\\')
          $smokeEnvironment = Join-Path $portable "data/runtime-environment/environment"
          & $runtimePython "$portable/runtime/bootstrap_runtime.py" --environment $smokeEnvironment
          if ($LASTEXITCODE -ne 0) { throw "Installed-layout runtime bootstrap failed" }
          & "$smokeEnvironment/Scripts/python.exe" -I -c "import drpa_runner, DrissionPage, ipykernel, jupyter_client, zmq, nbformat; from drpa_runner.context import RuntimeContext; assert hasattr(RuntimeContext, 'open_output_directory'); print('DRPA_WINDOWS_RUNTIME_OK')"
          if ($LASTEXITCODE -ne 0) { throw "Installed-layout Python/Jupyter import smoke failed" }
          Remove-Item (Join-Path $portable "data") -Recurse -Force

          python tools/windows/build_update_package.py --stage $portable --version "$env:DRPA_VERSION" --catalog-only
          if ($LASTEXITCODE -ne 0) { throw "Failed to build the full install catalog" }
          $catalog = Join-Path $assets "drpa-next-$env:DRPA_VERSION-windows-x86_64-install-manifest.json"
          Copy-Item "$portable/install-manifest.json" $catalog

          choco install nsis --version=3.12.0 --no-progress --yes
          $makensis = "C:/Program Files (x86)/NSIS/makensis.exe"
          if (-not (Test-Path $makensis)) { throw "Pinned NSIS compiler is missing" }
          $installer = Join-Path $assets "drpa-next-$env:DRPA_VERSION-windows-x86_64-setup.exe"
          & $makensis "/DPAYLOAD_DIR=$portable" "/DOUTPUT_FILE=$installer" "/DICON_FILE=$env:GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.ico" "installer/windows/drpa-next.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile registry-free Windows installer" }
          $registryCalls = Select-String -Path "installer/windows/drpa-next.nsi" -Pattern "WriteReg|DeleteReg|ReadReg|InstallDirRegKey" -CaseSensitive:$false
          if ($registryCalls) { throw "Installer contains a forbidden registry instruction" }

      - name: Upload offline desktop package
        uses: actions/upload-artifact@v4
        with:
          name: drpa-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_kind) || 'update' }}
      DRPA_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Add example package and verify release set
        shell: bash
        run: |
          set -euo pipefail
          expected=2
          if [[ "$RELEASE_KIND" == "full" ]]; then
            mkdir -p artifacts/example
            cp examples/bing_daily_image.rpaz "artifacts/example/drpa-example-bing-daily-image-${DRPA_VERSION}.rpaz"
            expected=3
          fi
          mapfile -t assets < <(find artifacts -type f | sort)
          test "${#assets[@]}" -eq "$expected"
      - name: Publish immutable desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f | sort)
          if [[ "$RELEASE_KIND" == "full" ]]; then
            tag="desktop-v${DRPA_VERSION}"
            title="DRPA Next ${DRPA_VERSION} 全量离线安装包"
            notes="$(printf 'DRPA Next %s Windows x64 稳定版全量离线安装包。\n\n包含免注册表 Setup、封装的 Python 3.11/Chrome 运行时、Fixed Version WebView2、schema-2 安装库存和 Bing 每日一图 RPAZ 示例。后续日常版本使用轻量更新包，仅替换变化文件，并保留可视化进度、启动确认和失败回滚。' "$DRPA_VERSION")"
          else
            tag="desktop-v${DRPA_VERSION}-preview-${GITHUB_RUN_NUMBER}"
            title="DRPA Next ${DRPA_VERSION} 轻量更新 · ${GITHUB_RUN_NUMBER}"
            notes="$(printf 'DRPA Next %s Windows x64 轻量更新包。\n\n仅包含变化的应用、更新器文件和合并后的安装库存；保留现有 Python、Chrome、Fixed Version WebView2 与用户数据。更新前检查协议和精确基线版本，重启后的 Host 确认窗口成功启动后才清理备份。' "$DRPA_VERSION")"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$RELEASE_KIND" == "full" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --latest
            else
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
            fi
          else
            if [[ "$RELEASE_KIND" == "full" ]]; then
              gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
            else
              gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
            fi
          fi
