name: Desktop packaging validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: portable-host
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo timeout 300 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Generate native icon formats
        run: npm exec --workspace @drpa/desktop -- tauri icon src-tauri/icons/icon.png
      - name: Build native package
        if: runner.os != 'Windows'
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Build Windows GUI host without an installer
        if: runner.os == 'Windows'
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --no-bundle
      - name: Normalize installer names and checksums
        if: runner.os != 'Windows'
        run: >-
          python tools/release/collect_desktop_assets.py
          --platform "${{ matrix.platform }}"
          --version "0.2.0"
          --bundle-dir "target/${{ matrix.target }}/release/bundle"
          --output "${{ runner.temp }}/desktop-assets"
      - name: Collect Windows host for engineering validation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "desktop-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $binary = "target/${{ matrix.target }}/release/drpa-desktop.exe"
          $archive = Join-Path $assets "drpa-next-0.2.0-windows-x86_64-host-only.zip"
          Compress-Archive -Path $binary -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding ascii "$archive.sha256"
      - name: Upload installer assets
        uses: actions/upload-artifact@v4
        with:
          name: drpa-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
