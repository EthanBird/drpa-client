name: Desktop preview installers

on:
  workflow_dispatch:
  push:
    branches:
      - codex/drpa-next-platform
    paths:
      - ".github/workflows/desktop-release.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package-lock.json"
      - "package.json"
      - "tools/release/**"

permissions:
  contents: write

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Generate native icon formats
        run: npm exec --workspace @drpa/desktop -- tauri icon src-tauri/icons/icon.png
      - name: Build native installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        run: npm run tauri:build --workspace @drpa/desktop -- --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Normalize installer names and checksums
        run: >-
          python tools/release/collect_desktop_assets.py
          --platform "${{ matrix.platform }}"
          --version "0.2.0"
          --bundle-dir "target/${{ matrix.target }}/release/bundle"
          --output "${{ runner.temp }}/desktop-assets"
      - name: Upload installer assets
        uses: actions/upload-artifact@v4
        with:
          name: drpa-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish immutable desktop preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v0.2.0-preview-${GITHUB_RUN_NUMBER}"
          mapfile -t assets < <(find artifacts -type f | sort)
          test "${#assets[@]}" -eq 10
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          Engineering preview of the DRPA Next desktop host and interface.

          Included native packages:
          - Windows x64 NSIS installer (with the WebView2 offline installer embedded)
          - Linux x64 AppImage and Debian package
          - macOS Apple Silicon and Intel disk images

          Every installer has a matching SHA-256 file. This preview is intentionally unsigned and is not yet notarized; operating systems may show an unknown-publisher warning. The sealed, air-gap-tested Python runtime bundles are published separately in the latest `offline-runtime-*` prerelease. Runtime embedding and production signing are release gates, not claims of this preview.
          EOF
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DRPA Next desktop preview · run ${GITHUB_RUN_NUMBER}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
