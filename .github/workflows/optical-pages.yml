name: Deploy optical transfer web app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/drpa-next-platform
    paths:
      - "apps/optical-web/**"
      - "apps/desktop/src/features/optical/**"
      - "apps/desktop/src/pages/OpticalTransferPage.tsx"
      - "apps/desktop/src/styles/optical-transfer.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/optical-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build optical web app
        run: npm run build:optical
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/optical-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
