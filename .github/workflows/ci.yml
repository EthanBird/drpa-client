name: DRPA Next CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/drpa-next-platform

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python-runtime:
    name: Python runtime (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e './runtime/python[test]'
      - run: python -m pytest -q runtime/python/tests

  offline-policy:
    name: Offline dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python tools/offline/validate_requirements.py offline/requirements/runtime.txt
      - run: python -m unittest discover -s tools/offline/tests -v
      - run: python -m compileall -q tools/offline offline/bootstrap runtime/python/src
      - run: python tools/release/check_version_consistency.py --expected 1.0.0
      - run: python -m pip install "pytest==8.4.2"
      - run: python -m pytest -q tools/windows/tests

  rust-core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p drpa-protocol -p drpa-package -p drpa-host --all-targets -- -D warnings
      - run: cargo test -p drpa-protocol -p drpa-package -p drpa-host

  desktop-host:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p drpa-desktop
