[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drpa-client"
version = "0.1.0"
description = "Lightweight Python RPA desktop client powered by PySide6 and DrissionPage."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "drpa-client contributors" }
]
dependencies = [
  "PySide6",
  "DrissionPage",
  "PyYAML",
  "psutil",
  "platformdirs",
  "packaging"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]

[project.scripts]
drpa-client = "drpa_client.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drpa_client = [
  "app/ui/themes/*.qss"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
