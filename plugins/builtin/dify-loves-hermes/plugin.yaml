schema: 1
id: dify-loves-hermes
name: Dify Loves Hermes
version: 0.1.0
description: 将 Dify App API 转换为本地 OpenAI 兼容接口，并补充外部工具调用桥。
types:
  - provider-adapter
  - service
service:
  runtime: bundled-python
  entry: service/dify_bridge.py
  transport: http
  endpoint: http://127.0.0.1:{port}/v1
  healthcheck: http://127.0.0.1:{port}/v1/health
tools: []
default_config:
  base_url: http://127.0.0.1:5001/v1
  api_key: ""
  app_type: chat
  model: dify-app
  port: 34121
  user_prefix: drpa
  tool_bridge: true
  timeout_seconds: 120
