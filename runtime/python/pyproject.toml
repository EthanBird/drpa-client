[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drpa-runtime-python"
version = "1.0.0"
description = "Python runtime adapter for DRPA Next"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
browser = ["DrissionPage>=4.1,<5"]

[project.scripts]
drpa-python-runtime = "drpa_runner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
