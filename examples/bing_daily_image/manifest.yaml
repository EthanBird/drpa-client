schema: 2
id: com.drpa.bing-daily-image
name: Bing 每日一图
version: 2.0.4

entrypoint:
  runtime: python
  module: main.py
  callable: main

runtime:
  python: "3.11.*"

capabilities:
  network:
    allow:
      - "www.bing.com"
  filesystem:
    read: []
    write:
      - "$outputs"

parameters:
  - id: market
    type: string
    required: false
    default: zh-CN
  - id: image_count
    type: number
    required: false
    default: 1
  - id: open_output_directory
    type: boolean
    required: false
    default: false
