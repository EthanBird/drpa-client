id: marketing_cancel_order_dispatch
name: 营销销户派工自动化
version: 0.1.0
entry: main.py
description: 使用 DrissionPage 在营销管理系统中处理销户工单、签收、现场停电、人员传递、任务分派和发送作业计划信息。
author: drpa-client

runtime:
  python: ">=3.11"
  isolation: venv

dependencies:
  strategy: offline-first
  pip:
    - DrissionPage
  local:
    common:
      - wheels/common/*.whl
    windows:
      - wheels/windows/*.whl
    linux:
      - wheels/linux/*.whl

params:
  - name: system_url
    label: 系统 URL
    type: string
    required: true
    default: http://10.141.12.203:8007/up/user/userdesktop/index?domainAuthSupport=true
    description: 营销管理系统入口地址。

  - name: business_type
    label: 业务类型关键字
    type: string
    required: true
    default: 销户
    description: 用于高级查询和工单标题匹配的业务类型关键字。

  - name: loop_count
    label: 循环处理次数
    type: integer
    required: true
    default: 10
    description: 主流程最多循环处理多少张工单。

  - name: work_date_offset_days
    label: 计划日期偏移天数
    type: integer
    required: true
    default: 1
    description: 计划作业日期相对今天的偏移天数，默认明天。

  - name: responsible_person
    label: 负责人
    type: string
    required: true
    default: 萧志锋
    description: 任务分派和计划负责人。

  - name: assistant_person
    label: 协助人
    type: string
    required: true
    default: 陈贺贤
    description: 任务分派协助人和计划作业人。

  - name: operator_person
    label: 操作人
    type: string
    required: true
    default: 沈毅聪
    description: 派工单的人，用于选择人员传递。

  - name: responsible_phone
    label: 负责人电话
    type: string
    required: true
    default: "13318460198"
    description: 作业计划中的工作负责人联系电话。

  - name: work_location_prefix
    label: 工作地点前缀
    type: string
    required: false
    default: 【麻涌】
    description: 写入计划工作地点前的固定前缀。

  - name: plan_content_prefix
    label: 计划内容前缀
    type: string
    required: false
    default: 【低压销户验收】【户外】【临近带电】
    description: 写入计划内容前的固定前缀。

  - name: plan_content_remove_text
    label: 计划内容删除文本
    type: string
    required: false
    default: +计量装置销户拆除
    description: 从原计划内容中删除的文本。

  - name: survey_mode
    label: 勘查方式
    type: string
    required: true
    default: 否
    description: 作业计划中的勘查方式。

  - name: specialty_category
    label: 专业分类
    type: string
    required: true
    default: 计量专业
    description: 作业计划中的专业分类。

  - name: safety_job_type
    label: 安监作业类型
    type: string
    required: true
    default: 营销运维
    description: 作业计划中的安监作业类型。

  - name: plan_start_time
    label: 计划开始时间
    type: string
    required: true
    default: "08:00:00"
    description: HH:MM:SS，例如 08:00:00。

  - name: plan_end_time
    label: 计划结束时间
    type: string
    required: true
    default: "19:59:59"
    description: HH:MM:SS，例如 19:59:59。

  - name: wait_before_each_loop_seconds
    label: 每轮等待秒数
    type: integer
    required: true
    default: 10
    description: 主循环每轮开始前等待的秒数。

  - name: headless
    label: 无头浏览器
    type: boolean
    required: false
    default: false
    description: 是否使用无头浏览器。该业务系统通常建议关闭。
